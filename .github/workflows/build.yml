name: Build

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm

      # @lookout/react records through Lookout's Rust engine, compiled to WebAssembly (@lookout/wasm).
      - name: Setup Rust for WebAssembly
        run: |
          rustup target add wasm32-unknown-unknown
          bash vendor/lookout/packages/wasm/install-bindgen.sh

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

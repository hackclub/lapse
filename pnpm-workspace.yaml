packages:
  - packages/*
  - apps/*
  - vendor/lookout/packages/shared
  - vendor/lookout/clients/react

overrides:
  protobufjs: "7.5.5"
  "@lookout/shared": "workspace:*"
  "@videojs/react": "10.0.0-beta.25"
  "deepmerge-ts@<8.0.0": "^8.0.1"
  "mysql2@<3.23.1": "^3.23.1"
  "esbuild@<0.28.1": "^0.28.2"
  "yaml@>=2.0.0 <2.8.3": "^2.8.3"

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  "@sentry/cli": true
  esbuild: true
  msgpackr-extract: true
  msw: true
  prisma: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - bullmq@6.0.6
  - fastify@5.11.2
  - nanoid@6.0.1
  - '@next/env@16.3.6 || 16.3.8'
  - '@next/swc-darwin-arm64@16.3.6 || 16.3.8'
  - '@next/swc-darwin-x64@16.3.6 || 16.3.8'
  - '@next/swc-linux-arm64-gnu@16.3.6 || 16.3.8'
  - '@next/swc-linux-arm64-musl@16.3.6 || 16.3.8'
  - '@next/swc-linux-x64-gnu@16.3.6 || 16.3.8'
  - '@next/swc-linux-x64-musl@16.3.6 || 16.3.8'
  - '@next/swc-win32-arm64-msvc@16.3.6 || 16.3.8'
  - '@next/swc-win32-x64-msvc@16.3.6 || 16.3.8'
  - next@16.3.6 || 16.3.8
